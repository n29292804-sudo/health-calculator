    results.innerHTML = "";

    if(value === "") {
        results.style.display = "none";
        return;

    const filtered = products.filter(p => p.name.toLowerCase() === value);

<script>
const input = document.getElementById("searchInput");
const results = document.getElementById("searchResults");

input.addEventListener("input", function() {
    const value = this.value.toLowerCase();
    results.innerHTML = "";

    if(value === "") {
        results.style.display = "none";
        return;
    }

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(value)
    );

    filtered.forEach(p => {
        const div = document.createElement("div");
        div.textContent = p.name;
        div.style.cursor = "pointer";

        div.addEventListener("click", () => {
            window.location.href = p.link; // ВАЖНО: link, не url
        });

        results.appendChild(div);
    });

    results.style.display = filtered.length ? "block" : "none";
});
</script>

</script>

<body>

<div class="container">

<h1>Калькулятор калорий сыра</h1>

<p>Введите вес сыра в граммах</p>

<input type="number" id="weight" placeholder="например 120">

<br>

<button onclick="calculate()">Рассчитать</button>

<div class="result" id="result"></div>

<p style="margin-top:30px;">
Сыр содержит примерно <b>402 ккал на 100 г</b>.
</p>

</div>

<script>

function calculate(){

let weight = document.getElementById("weight").value;

let calories = weight * 402 / 100;

document.getElementById("result").innerText =
"Калории: " + calories.toFixed(1) + " ккал";

}

</script>

<script src="products.js"></script>

<script>
function searchProducts() {
  const query = document.getElementById('searchBox').value.toLowerCase();
  const results = document.getElementById('results');

  results.innerHTML = '';

  if (!query) return;

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(query)
  );

  if (filtered.length === 0) {
    results.innerHTML = '<li>Ничего не найдено</li>';
    return;
  }

  filtered.forEach(p => {
    const li = document.createElement('li');
    li.innerHTML = <a href="${p.link}">${p.name}</a>;
    results.appendChild(li);
  });
}
</script>
